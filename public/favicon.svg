<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="70%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Electric Blue Main Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Bright Blue Top Reflection -->
    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Silver Chrome Metallic Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.3" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Metallic Canvas Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.6" />

  <g filter="url(#3dShadow)" transform="translate(0, 0)">
    <!-- 1. Silver Chrome Right Arc -->
    <path d="M 270 55 C 375 55, 455 135, 455 240 C 455 285, 440 325, 415 360 L 372 328 C 390 302, 400 272, 400 240 C 400 168, 342 110, 270 110 Z" fill="url(#chromeGrad)"/>

    <!-- 2. Electric Blue Crescent Outer Ring (Left Side) -->
    <path d="M 240 50 C 130 50, 45 140, 45 256 C 45 372, 130 462, 256 462 C 320 462, 375 435, 415 390 L 370 350 C 340 385, 298 405, 256 405 C 172 405, 105 338, 105 256 C 105 174, 172 107, 256 107 L 256 50 Z" fill="url(#blueGlow)"/>

    <!-- Crescent Inner Shimmer Edge -->
    <path d="M 235 62 C 140 62, 62 145, 62 256 C 62 367, 140 450, 250 450 C 310 450, 360 425, 398 382 L 388 372 C 352 410, 305 432, 250 432 C 152 432, 80 353, 80 256 C 80 159, 152 80, 250 80 Z" fill="url(#blueHighlight)" opacity="0.9" />

    <!-- 3. Ascending Silver Bar Chart (Bottom Right) -->
    <rect x="225" y="340" width="22" height="65" rx="3" fill="url(#chromeGrad)" />
    <rect x="260" y="305" width="22" height="100" rx="3" fill="url(#chromeGrad)" />
    <rect x="295" y="265" width="22" height="140" rx="3" fill="url(#chromeGrad)" />
    <rect x="330" y="215" width="22" height="190" rx="3" fill="url(#chromeGrad)" />

    <!-- 4. Central Bold 3D Metallic Blue Dollar Sign ($) -->
    <!-- Drop Shadow Offset Layer -->
    <text x="238" y="278" font-family="'Arial Black', 'Impact', sans-serif" font-size="220" font-weight="900" fill="#030712" text-anchor="middle" dominant-baseline="central">$</text>
    <text x="230" y="270" font-family="'Arial Black', 'Impact', sans-serif" font-size="220" font-weight="900" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">$</text>
    <!-- Top Gradient Layer -->
    <text x="224" y="262" font-family="'Arial Black', 'Impact', sans-serif" font-size="220" font-weight="900" fill="url(#blueGlow)" stroke="url(#blueHighlight)" stroke-width="4" text-anchor="middle" dominant-baseline="central">$</text>

    <!-- 5. Dynamic 3D Blue Upward Swooping Arrow -->
    <path d="M 85 375 C 130 355, 205 315, 305 225 L 390 145" fill="none" stroke="url(#blueGlow)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 85 370 C 130 350, 205 310, 305 220 L 390 140" fill="none" stroke="url(#blueHighlight)" stroke-width="12" stroke-linecap="round"/>

    <!-- Arrowhead -->
    <path d="M 350 100 L 455 125 L 400 220 Z" fill="url(#blueGlow)" stroke="url(#blueHighlight)" stroke-width="6" />
    <path d="M 365 118 L 440 135 L 402 200 Z" fill="url(#blueHighlight)" opacity="0.8" />
  </g>
</svg>
