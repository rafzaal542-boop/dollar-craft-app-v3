  <!-- Central 3D Metallic Blue Dollar Sign ($) -->
  <text x="52" y="63" fill="#030712" font-size="52" font-weight="900" font-family="Arial Black, sans-serif" text-anchor="middle" dominant-baseline="central">$</text>
  <text x="50" y="61" fill="url(#bE)" font-size="52" font-weight="900" font-family="Arial Black, sans-serif" text-anchor="middle" dominant-baseline="central">$</text>
  <text x="48" y="58" fill="url(#bF)" stroke="url(#bH)" stroke-width="1" font-size="52" font-weight="900" font-family="Arial Black, sans-serif" text-anchor="middle" dominant-baseline="central">$</text>

  <!-- 3D Upward Blue Arrow -->
  <path d="M 16 82 C 26 78, 46 70, 68 52 L 92 32" fill="none" stroke="url(#bF)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 16 80 C 26 76, 46 68, 68 50 L 92 30" fill="none" stroke="url(#bH)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 82 22 L 110 22 L 96 46 Z" fill="url(#bF)" stroke="url(#bH)" stroke-width="1.5"/>
